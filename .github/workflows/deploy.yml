name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 수동으로도 돌릴 수 있게
  workflow_dispatch:

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살림 (진행 중인 건 취소하지 않음)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: ESLint 점검
        run: npm run lint

      - name: 빌드
        run: npm run build:prod
        env:
          VITE_WEATHER_API_KEY: ${{ secrets.VITE_WEATHER_API_KEY }}

      # GitHub Pages 는 SPA 라우팅을 몰라서 /about 같은 주소를 직접 열면 404 를 준다.
      # 404.html 을 index.html 과 똑같이 만들어두면 그때도 앱이 뜨고 라우터가 경로를 처리함
      - name: SPA 새로고침 대비 404 폴백 생성
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
